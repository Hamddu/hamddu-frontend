name = "hamddu-image-upload"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[r2_buckets]]
binding = "HAMDDU_IMAGES"
bucket_name = "hamddu-images"

[vars]
# R2 버킷 Public Access URL (배포 전에 직접 입력)
# Cloudflare 대시보드 → R2 → hamddu-images → Settings → Public Access 활성화 후 나오는 URL
# 예: https://pub-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.r2.dev
R2_PUBLIC_URL = "REPLACE_WITH_R2_PUBLIC_URL"
